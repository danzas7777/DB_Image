html<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя первая страница</title>
    <style>
        body 
        {
            font-family: Arial, sans-serif;
            max-width: 1000px; /* Сделаем страницу чуть шире для сетки */
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        /* Стиль для контейнера галереи */
        .gallery 
        {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* Авто-колонки */
            gap: 20px; /* Отступы между картинками */
        }
        /* Стиль для карточки с картинкой */
        .gallery-item 
        {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .gallery-item img 
        {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Привет, мир!</h1>
    <p>Это самый простой пример HTML-файла.</p>

    <!-- Первая картинка -->
    <div class="gallery">
    <div class="gallery-item">
        <img src="Images\Screenshot_1.jpg" alt="Картинка 1">
        <p>Описание 1</p>
    </div>
    
    <!-- Вторая картинка -->
    <div class="gallery-item">
        <img src="Images\Screenshot_1 (2).jpg" alt="Картинка 2">
        <p>Описание 2</p>
    </div>
    
    <!-- Третья картинка -->
    <div class="gallery-item">
        <img src="Images\Untitled-2.jpg" alt="Картинка 3">
        <p>Описание 3</p>
    </div>
</body>
</html>
